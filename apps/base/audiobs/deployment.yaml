apiVersion: apps/v1
kind: Deployment
metadata:
  name: placeholder
spec:
  replicas: 1
  selector:
    matchLabels:
      app: placeholder
  template:
    metadata:
      labels:
        app: placeholder
    spec:
      securityContext:
        fsGroup: 33 # www-data group ID
        runAsUser: 33 # www-data user ID
        runAsGroup: 33 # www-data group ID
      containers:
        - name: placeholder
          image: sissbruecker/placeholder:1.42.0
          envFrom:
            - secretRef:
                name: homelab-placeholder-superuser-credentials
          ports:
            - containerPort: 9090

          securityContext:
            allowPrivilegeEscalation: false

          volumeMounts:
            - name: placeholder-data
              mountPath: /etc/placeholder/data
      volumes:
        - name: placeholder-data
          persistentVolumeClaim:
            claimName: placeholder-data-pvc
