apiVersion: apps/v1
kind: Deployment
metadata:
  name: audiobs
spec:
  replicas: 1
  selector:
    matchLabels:
      app: audiobs
  template:
    metadata:
      labels:
        app: audiobs
    spec:
      securityContext:
        fsGroup: 33 # www-data group ID
        runAsUser: 33 # www-data user ID
        runAsGroup: 33 # www-data group ID
      containers:
        - name: audiobs
          image: sissbruecker/audiobs:1.42.0
          envFrom:
            - secretRef:
                name: homelab-audiobs-superuser-credentials
          ports:
            - containerPort: 9090

          securityContext:
            allowPrivilegeEscalation: false

          volumeMounts:
            - name: audiobs-data
              mountPath: /etc/audiobs/data
      volumes:
        - name: audiobs-data
          persistentVolumeClaim:
            claimName: audiobs-data-pvc
