apiVersion: apps/v1
kind: Deployment
metadata:
  name: audiobs
spec:
  replicas: 1
  selector:
    matchLabels:
      app: audiobs
  template:
    metadata:
      labels:
        app: audiobs
    spec:
      securityContext:
        fsGroup: 1000 # node group ID
        runAsUser: 1000 # node user ID
        runAsGroup: 1000 # node group ID
      containers:
        - name: audiobs
          image: ghcr.io/advplyr/audiobookshelf:2.33.0
          envFrom:
            - configMapRef:
                name: audiobs-configmap
          ports:
            - containerPort: 3005
          securityContext:
            allowPrivilegeEscalation: false

       restartPolicy: Always

          volumeMounts:
            - name: audiobs-config
              mountPath: /config
            - name: audiobs-metadata
              mountPath: /metadata
            - name: audiobs-audiobooks
              mountPath: /audiobooks
            - name: audiobs-podcasts
              mountPath: /podcasts
      volumes:
        - name: audiobs-config
          persistentVolumeClaim:
            claimName: audiobs-config-pvc
        - name: audiobs-metadata
          persistentVolumeClaim:
            claimName: audiobs-metadata-pvc
        - name: audiobs-audiobooks
          persistentVolumeClaim:
            claimName: audiobs-audiobooks-pvc
        - name: audiobs-podcasts
          persistentVolumeClaim:
            claimName: audiobs-podcasts-pvc
